name: Build release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/neochat
            asset: NeoChat-linux-x86_64
          - os: windows-latest
            binary: target/release/neochat.exe
            asset: NeoChat-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libudev-dev
      - name: Update Rust stable
        run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --release --locked --bin neochat
      - name: Prepare binary
        shell: bash
        run: cp '${{ matrix.binary }}' '${{ matrix.asset }}'
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item target/release/neochat.exe package/NeoChat.exe
          Copy-Item README.md package/README.md
          Copy-Item README.pt-BR.md package/README.pt-BR.md
          Copy-Item README.fr.md package/README.fr.md
          Copy-Item LICENSE package/LICENSE
          Compress-Archive -Path package/* -DestinationPath NeoChat-windows-x86_64.zip
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$env:RELEASE_TAG" "$env:ASSET" --clobber
        shell: pwsh
      - name: Upload Windows archive
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" NeoChat-windows-x86_64.zip LICENSE --clobber
        shell: pwsh
